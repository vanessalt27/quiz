<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz · Gestion du stress</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#F4F2FB; --soft:#E9E6F7; --card:#FFFFFF; --ink:#2F2B45; --muted:#6E6890;
  --violet:#4A4382; --violet2:#5F57A8; --lav:#8F87D2; --lilac:#B497D6;
  --mint:#74C2AC; --blue:#7FA6D8; --coral:#EE9A8F; --yellow:#F3CD7E;
  --ok:#2F9E7E; --okbg:#DDF3EC; --ko:#D9574A; --kobg:#FBE3E0;
  --radius:22px; --shadow:0 10px 30px rgba(74,67,130,.12); --shadow-sm:0 3px 10px rgba(74,67,130,.10);
  --font:"Century Gothic","Poppins",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before,body::after{content:"";position:fixed;border-radius:50%;z-index:-1;pointer-events:none}
body::before{width:420px;height:420px;background:#E4E1F4;top:-180px;left:-160px}
body::after{width:360px;height:360px;background:#D7EEE6;bottom:-160px;right:-120px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input{font-family:inherit}
h1,h2,h3{margin:0;color:var(--violet);line-height:1.15}
.hidden{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(244,242,251,.85);backdrop-filter:blur(10px);border-bottom:1px solid rgba(143,135,210,.18)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:64px}
.logo{background:#fff;border-radius:999px;padding:7px 14px;box-shadow:var(--shadow-sm);display:flex;align-items:center}
.logo img{height:24px;display:block}
.tb-title{font-size:13px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.score-pill{background:var(--violet);color:#fff;box-shadow:var(--shadow-sm)}
.score-pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.icon-btn{border:0;background:#fff;border-radius:50%;width:40px;height:40px;box-shadow:var(--shadow-sm);font-size:18px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--soft)}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:999px;padding:14px 26px;font-weight:700;font-size:17px;background:var(--violet);color:#fff;box-shadow:0 6px 18px rgba(74,67,130,.28);transition:transform .15s, box-shadow .15s, opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(74,67,130,.32)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:#fff;color:var(--violet);box-shadow:var(--shadow-sm)}
.btn.mint{background:var(--ok)}
.btn.small{padding:9px 16px;font-size:15px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--violet2)}
.eyebrow::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--lav)}

/* ---------- login ---------- */
#login{min-height:calc(100vh - 64px);display:flex;align-items:center;padding:24px 0}
.login-card{display:grid;grid-template-columns:1.05fr .95fr;background:var(--card);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;width:100%}
.login-form{padding:44px 44px 36px;position:relative;background:var(--bg)}
.login-form::before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#E1DEF3;top:-90px;left:-70px}
.login-form>*{position:relative}
.badge-mod{display:inline-block;background:var(--lav);color:#fff;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:8px 18px;border-radius:999px;margin-bottom:18px}
.login-form h1{font-size:clamp(30px,4vw,42px);font-weight:800}
.login-form p.lead{margin:12px 0 22px;font-size:17px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;font-weight:700;color:var(--violet);margin-bottom:6px}
.field input{width:100%;border:2px solid #DCD8F0;border-radius:14px;padding:13px 16px;font-size:17px;background:#fff;color:var(--ink);outline:none;transition:border-color .2s, box-shadow .2s}
.field input:focus{border-color:var(--lav);box-shadow:0 0 0 4px rgba(143,135,210,.2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.code-input{text-transform:uppercase;letter-spacing:.5em;font-weight:800;text-align:center;font-size:24px!important;font-family:"Consolas","Courier New",monospace!important}
.code-input::placeholder{letter-spacing:.5em;color:#C9C4E6}
.err{color:var(--ko);font-weight:700;font-size:15px;min-height:22px;margin:4px 0 8px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.login-photo .float{position:absolute;left:22px;bottom:22px;right:22px;background:rgba(255,255,255,.92);border-radius:18px;padding:14px 18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
.login-photo .float b{color:var(--violet)}
.login-photo .float .big{font-size:30px}

/* ---------- home ---------- */
.hello{margin:26px 0 18px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.hello h1{font-size:clamp(28px,4vw,40px);font-weight:800}
.hello p{margin:6px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px}
.stat .ico{font-size:28px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.stat b{display:block;font-size:22px;color:var(--violet);line-height:1.1}
.stat small{color:var(--muted);font-size:13px}
.badges-row{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 22px}
.bdg{background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;box-shadow:var(--shadow-sm);display:inline-flex;gap:6px;align-items:center}
.bdg.off{opacity:.38;filter:grayscale(1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;margin-bottom:28px}
.qcard{position:relative;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 22px 18px;overflow:hidden;text-align:left;border:0;display:flex;flex-direction:column;gap:6px;transition:transform .2s, box-shadow .2s;min-height:230px}
.qcard:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(74,67,130,.18)}
.qcard::before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:var(--c);opacity:.22;right:-55px;top:-55px}
.qcard .num{font-size:54px;font-weight:800;color:var(--lav);line-height:1;letter-spacing:-.02em}
.qcard .emo{position:absolute;right:20px;top:18px;font-size:40px}
.qcard h3{font-size:21px;font-weight:800}
.qcard p{margin:0;color:var(--muted);font-size:15px}
.qcard .meta{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qcard .meta small{color:var(--muted);font-size:13px}
.status{border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.status.lock{background:var(--soft);color:var(--violet)}
.status.open{background:var(--violet);color:#fff}
.status.done{background:var(--okbg);color:var(--ok)}
.qcard.locked .num,.qcard.locked .emo{filter:grayscale(.7);opacity:.55}
.stars{color:#E9B949;letter-spacing:2px;font-size:18px}
.stars .off{color:#DAD6EC}
.home-foot{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:0 0 40px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(47,43,69,.55);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:26px;padding:30px 28px 24px;max-width:440px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.25);text-align:center;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal .big-emo{font-size:52px;line-height:1}
.modal h2{margin:8px 0 6px;font-size:24px}
.modal p{color:var(--muted);margin:0 0 16px}
.modal .acts{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}

/* ---------- quiz ---------- */
.qhead{display:flex;align-items:center;gap:12px;margin:20px 0 14px;flex-wrap:wrap}
.qhead h2{font-size:20px;flex:1;min-width:180px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:#DCD8F0;transition:all .3s}
.dot.cur{background:var(--violet);transform:scale(1.3)}
.dot.good{background:var(--ok)}
.dot.mid{background:var(--yellow)}
.dot.bad{background:var(--coral)}
.training{background:var(--yellow);color:#6B4E0B;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:700;margin-bottom:12px}
.gcard{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:28px 30px;margin-bottom:30px;position:relative;animation:slidein .35s ease}
@keyframes slidein{from{opacity:0;transform:translateY(14px)}}
.gtype{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--soft);color:var(--violet)}
.gpts{float:right;color:var(--muted);font-size:14px;font-weight:700}
.gcard h3.q{font-size:clamp(20px,2.6vw,25px);margin:14px 0 6px;font-weight:800}
.hint{color:var(--muted);font-size:14.5px;margin:0 0 18px}
.gfoot{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.gfoot .need{color:var(--muted);font-size:14px}

/* case */
.case{background:var(--bg);border-radius:20px;padding:16px 18px;margin:12px 0 6px;border-left:6px solid var(--yellow)}
.case .tag{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--violet2)}
.case h4{margin:4px 0 6px;color:var(--violet);font-size:19px}
.case p{margin:0}
.case ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.case li{background:#fff;border-radius:12px;padding:8px 12px;font-size:15px}
.case li b{color:var(--violet)}

/* options */
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid #E2DEF3;border-radius:16px;padding:13px 16px;transition:all .15s;font-size:16.5px;width:100%}
.opt:hover:not(:disabled){border-color:var(--lav);background:#FBFAFF}
.opt .let{flex:none;width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--violet);font-weight:800;display:grid;place-items:center;transition:all .15s}
.opt.sel{border-color:var(--violet);background:#F3F1FC}
.opt.sel .let{background:var(--violet);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .let{background:var(--ok);color:#fff}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.opt.ko .let{background:var(--ko);color:#fff}
.opt:disabled{cursor:default}
.opt .chk{margin-left:auto;font-size:20px}

/* vf */
.vf-box{text-align:center}
.vf-count{color:var(--muted);font-weight:700;font-size:14px}
.vf-stmt{font-size:clamp(20px,2.8vw,26px);font-weight:700;color:var(--violet);margin:14px auto 22px;max-width:640px;min-height:80px;display:flex;align-items:center;justify-content:center}
.vf-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.vf-btn{border:0;border-radius:20px;padding:18px 36px;font-size:20px;font-weight:800;min-width:160px;color:#fff;box-shadow:var(--shadow-sm);transition:transform .12s}
.vf-btn:hover{transform:translateY(-2px)}
.vf-btn.t{background:var(--ok)} .vf-btn.f{background:var(--ko)}
.vf-flash{font-size:18px;font-weight:800;min-height:30px;margin-top:14px}
.timer{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 10px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--yellow),var(--coral));transition:width 1s linear}
.timer-txt{font-weight:800;color:var(--violet);font-size:22px}
.recap{display:grid;gap:8px;margin-top:6px;text-align:left}
.recap div{border-radius:14px;padding:10px 14px;font-size:15px}
.recap .g{background:var(--okbg)} .recap .b{background:var(--kobg)} .recap .n{background:var(--soft)}
.recap small{display:block;color:var(--muted)}

/* chips & dnd */
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid #DCD8F0;border-radius:14px;padding:10px 14px;font-size:15.5px;font-weight:600;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 2px 6px rgba(74,67,130,.08);transition:border-color .15s, background .15s, transform .15s;line-height:1.25}
.chip:hover{border-color:var(--lav)}
.chip.selected{border-color:var(--violet);background:#EEEBFB;transform:scale(1.04);box-shadow:0 0 0 4px rgba(95,87,168,.18)}
.chip.dragging{opacity:.3}
.chip.ghost{position:fixed;z-index:200;pointer-events:none;transform:rotate(-2deg) scale(1.05);box-shadow:0 14px 30px rgba(47,43,69,.3);border-color:var(--violet);cursor:grabbing}
.chip.locked{cursor:default}
.chip.ok{border-color:var(--ok);background:var(--okbg)}
.chip.ko{border-color:var(--ko);background:var(--kobg)}
.chip .fix{font-size:12.5px;color:var(--ko);font-weight:700}
.pool{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-radius:18px;background:var(--bg);border:2px dashed #D6D1EE;min-height:66px;margin-bottom:16px}
.pool.over{border-color:var(--violet);background:#EEEBFB}
.pool:empty::after{content:"✓ Tout est placé !";color:var(--muted);font-size:14px;align-self:center}
.zones{display:grid;gap:12px}
.zone{border-radius:18px;background:color-mix(in srgb,var(--zc) 12%,#fff);border:2px solid color-mix(in srgb,var(--zc) 45%,#fff);padding:10px;min-height:120px;transition:all .15s;cursor:pointer}
.zone.over{transform:scale(1.02);border-color:var(--zc);box-shadow:0 0 0 4px color-mix(in srgb,var(--zc) 25%,transparent)}
.zone-h{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--ink);font-size:15px;padding:4px 6px 10px}
.zone-h .ze{width:32px;height:32px;border-radius:10px;background:var(--zc);color:#fff;display:grid;place-items:center;font-size:17px;flex:none}
.zone-b{display:flex;flex-direction:column;gap:8px;min-height:40px}
.zone-b .chip{width:100%}

/* order */
.olist{display:grid;gap:10px;counter-reset:o}
.olist .chip{width:100%;padding:12px 10px 12px 12px;font-size:16px}
.olist .chip::before{counter-increment:o;content:counter(o);flex:none;width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--violet);font-weight:800;display:grid;place-items:center}
.olist .chip .txt{flex:1}
.olist .chip .arrows{display:flex;gap:4px;flex:none}
.olist .chip .arrows button{border:0;background:var(--soft);border-radius:9px;width:34px;height:34px;font-size:15px;color:var(--violet)}
.olist .chip .arrows button:hover{background:var(--lav);color:#fff}
.olist .chip.drop-before{box-shadow:0 -4px 0 var(--violet)}
.olist .chip.drop-after{box-shadow:0 4px 0 var(--violet)}
.correct-order{margin-top:14px;background:var(--okbg);border-radius:16px;padding:12px 16px;font-size:15px}
.correct-order ol{margin:6px 0 0;padding-left:22px}

/* match */
.match{display:grid;grid-template-columns:1fr 1.4fr;gap:12px 18px;align-items:start}
.mcol{display:grid;gap:10px}
.mitem{position:relative;text-align:left;background:#fff;border:2px solid #E2DEF3;border-radius:14px;padding:12px 14px 12px 14px;font-size:15.5px;font-weight:600;transition:all .15s;display:flex;align-items:center;gap:10px;min-height:54px;width:100%}
.mitem:hover:not(:disabled){border-color:var(--lav)}
.mitem.big{font-size:18px;font-weight:800;color:var(--violet)}
.mitem.sel{border-color:var(--violet);background:#EEEBFB;box-shadow:0 0 0 4px rgba(95,87,168,.18)}
.mitem .tagn{flex:none;width:26px;height:26px;border-radius:50%;color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;margin-left:auto}
.mitem.ok{border-color:var(--ok);background:var(--okbg)}
.mitem.ko{border-color:var(--ko);background:var(--kobg)}
.mitem .fix{display:block;font-size:12.5px;color:var(--ko);font-weight:700}

/* fill */
.filltext{font-size:18px;line-height:2.4;background:var(--bg);border-radius:18px;padding:16px 20px}
.slot{display:inline-flex;vertical-align:middle;min-width:110px;min-height:44px;border:2px dashed var(--lav);border-radius:12px;background:#fff;margin:0 3px;align-items:center;justify-content:center;padding:2px;transition:all .15s;cursor:pointer}
.slot.over{border-color:var(--violet);background:#EEEBFB;transform:scale(1.05)}
.slot .chip{margin:0;padding:6px 12px}
.slot.okS{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.slot.koS{border-style:solid;border-color:var(--ko);background:var(--kobg)}
.slot .fix{font-size:12px;color:var(--ko);font-weight:800;padding:0 6px}
.bank{margin-top:16px}

/* memory */
.mem{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;perspective:900px}
.mcard{aspect-ratio:1/1.05;border:0;background:transparent;padding:0;position:relative}
.mcard .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.mcard.flip .in,.mcard.found .in{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:8px;text-align:center;font-weight:700;font-size:14px;line-height:1.2}
.mcard .back{background:linear-gradient(135deg,var(--violet2),var(--lav));color:#fff;font-size:30px;box-shadow:var(--shadow-sm)}
.mcard .front{transform:rotateY(180deg);background:#fff;border:2px solid #E2DEF3;color:var(--violet)}
.mcard .front.t2{background:#EAF6F2;border-color:#BFE3D7;color:#2C6B59}
.mcard.found .front{border-color:var(--ok);box-shadow:0 0 0 3px rgba(47,158,126,.25)}
.mem-info{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-weight:700;margin-bottom:10px}

/* slider */
.sl-wrap{padding:18px 6px 8px;text-align:center}
.sl-val{font-size:56px;font-weight:800;color:var(--violet);line-height:1}
.sl-val small{font-size:24px;color:var(--lav)}
input[type=range]{width:100%;margin:22px 0 6px;accent-color:var(--violet);height:30px}
.sl-scale{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}

/* stressometre */
.stm{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin:10px 0 6px}
.stm button{border:0;aspect-ratio:1;border-radius:14px;font-weight:800;font-size:19px;color:#fff;background:var(--sc);opacity:.85;transition:all .15s;min-width:0;padding:0}
.stm button:hover{opacity:1;transform:translateY(-3px)}
.stm button.sel{opacity:1;transform:scale(1.15);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--sc)}
.stm-lbl{display:flex;justify-content:space-between;color:var(--muted);font-size:13.5px;font-weight:700}
.stm-cmp{display:flex;gap:16px;justify-content:center;align-items:center;margin-top:16px;flex-wrap:wrap}
.stm-cmp .b{background:var(--bg);border-radius:16px;padding:12px 20px;text-align:center}
.stm-cmp .b b{font-size:30px;color:var(--violet);display:block}

/* breath */
.breath{display:flex;flex-direction:column;align-items:center;gap:12px}
.bsq{position:relative;width:230px;height:230px}
.bsq svg{width:100%;height:100%;overflow:visible}
.bsq .phase{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;color:var(--violet);font-size:20px}
.bsq .phase small{display:block;font-size:46px;color:var(--lav)}
.bcyc{color:var(--muted);font-weight:700}

/* anagram */
.ana-hint{background:var(--bg);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.ana-ans,.ana-tiles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;min-height:56px;margin-bottom:12px}
.tile{width:46px;height:52px;border-radius:12px;border:0;background:#fff;box-shadow:0 3px 0 #D6D1EE,0 4px 10px rgba(74,67,130,.12);font-size:22px;font-weight:800;color:var(--violet);transition:transform .1s}
.tile:hover{transform:translateY(-2px)}
.tile.used{visibility:hidden}
.ana-ans .tile{background:var(--violet);color:#fff;box-shadow:0 3px 0 #2F2B45}
.ana-ans.okA .tile{background:var(--ok)}
.ana-ans.koA .tile{background:var(--ko)}
.ana-slot{width:46px;height:52px;border-radius:12px;border:2px dashed #D6D1EE}
.ana-prog{text-align:center;color:var(--muted);font-weight:700;font-size:14px;margin-bottom:8px}
.ana-msg{text-align:center;font-weight:800;min-height:26px;margin-bottom:6px}

/* feedback */
.fb{margin-top:20px;border-radius:20px;padding:18px 20px;display:flex;gap:16px;align-items:flex-start;animation:slidein .3s}
.fb.good{background:var(--okbg)} .fb.mid{background:#FCF1D6} .fb.bad{background:var(--kobg)}
.fb .fe{font-size:42px;line-height:1}
.fb h4{margin:0 0 4px;font-size:20px;color:var(--ink)}
.fb .pts{font-weight:800;color:var(--violet)}
.fb p{margin:6px 0 0;font-size:15.5px}
.fb .streak{display:inline-block;background:#FFE3D0;color:#B4501E;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;margin-left:6px}

/* end screens */
.end{text-align:center;padding:36px 24px}
.end .bigstars{font-size:62px;letter-spacing:6px;margin:8px 0}
.end .bigstars span{display:inline-block;animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both;color:#E9B949}
.end .bigstars span.off{color:#DAD6EC}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}}
.end .score{font-size:46px;font-weight:800;color:var(--violet)}
.end p{color:var(--muted)}
.newbadges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.newbadges .bdg{font-size:16px;padding:10px 16px;animation:pop .5s both}
.intro{text-align:center;padding:36px 24px 30px}
.intro .num{font-size:96px;font-weight:800;color:var(--lav);line-height:1}
.intro h1{font-size:clamp(28px,4vw,40px);font-weight:800;margin:6px 0}
.intro .chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 24px}
.intro .chips span{background:var(--bg);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--violet);font-size:15px}

/* bilan */
.bilan table{width:100%;border-collapse:collapse;margin:10px 0 18px}
.bilan td,.bilan th{padding:10px 8px;border-bottom:1px solid #ECE9F7;text-align:left;font-size:15.5px}
.bilan th{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.bilan td:last-child,.bilan th:last-child{text-align:right}
.resline{background:var(--bg);border-radius:16px;padding:14px 16px;font-family:Consolas,monospace;font-size:14.5px;word-break:break-word;margin:10px 0}
.ctrl{display:inline-block;background:var(--violet);color:#fff;border-radius:12px;padding:6px 14px;letter-spacing:.25em;font-weight:800;font-family:Consolas,monospace}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:12px 22px;font-weight:700;z-index:300;animation:slidein .3s;box-shadow:var(--shadow)}
.floatpts{position:fixed;z-index:300;font-weight:800;font-size:26px;color:var(--ok);pointer-events:none;animation:floatup 1.2s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes floatup{to{transform:translateY(-70px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:400}

@media (max-width:820px){
  .login-card{grid-template-columns:1fr}
  .login-photo{min-height:200px;order:-1}
  .login-photo .float{display:none}
  .login-form{padding:30px 22px 26px}
  .stats{grid-template-columns:1fr 1fr}
  .mem{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:600px){
  body{font-size:16px}
  .tb-title{display:none}
  .gcard{padding:22px 18px;border-radius:22px}
  .match{grid-template-columns:1fr 1.3fr;gap:8px}
  .mitem{font-size:14px;padding:10px}
  .mitem.big{font-size:16px}
  .opts.two{grid-template-columns:1fr}
  .mem{grid-template-columns:repeat(3,1fr)}
  .mcard .face{font-size:12.5px}
  .stm{grid-template-columns:repeat(5,1fr)}
  .vf-btn{min-width:130px;padding:16px 22px}
  .row2{grid-template-columns:1fr}
  .filltext{font-size:16px;padding:12px 14px}
  .slot{min-width:90px}
  .btn{padding:13px 22px}
  .tile{width:38px;height:46px;font-size:19px}
  .ana-slot{width:38px;height:46px}
  .gpts{float:none;display:block;margin-top:8px}
}
.cert-box{margin-top:22px;border-radius:22px;padding:20px;background:linear-gradient(135deg,#F4F2FB,#EAF6F2);border:2px solid #E2DEF3}
.cert-box.locked{background:var(--bg)}
.cert-box h3{font-size:21px}
.cert-prev{width:100%;height:auto;display:block;border-radius:12px;box-shadow:var(--shadow);margin:14px 0;background:#fff}
.cert-prog{height:12px;background:#E2DEF3;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.cert-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--lav),var(--violet))}
.cert-banner{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;border-radius:20px;padding:16px 20px;margin:-6px 0 22px;box-shadow:var(--shadow);flex-wrap:wrap}
.cert-banner b{font-size:18px}.cert-banner .btn{background:#fff;color:var(--violet);margin-left:auto}
#printCert{display:none}
@media print{@page{size:A4 landscape;margin:0}body>*:not(#printCert){display:none!important}body::before,body::after{display:none}#printCert{display:block}#printCert canvas{width:100%;height:auto;display:block}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<header class="topbar">
  <div class="wrap">
    <div class="logo hidden" id="logoBox"><img id="logoImg" alt="Logo de l'établissement"></div>
    <div class="tb-title">Module : Gestion du stress</div>
    <span id="tbScore" class="pill score-pill hidden">⭐ <span id="tbPts">0</span> pts</span>
    <button id="btnSound" class="icon-btn" title="Son activé / coupé">🔊</button>
  </div>
</header>

<main class="wrap">
  <!-- LOGIN -->
  <section id="login" class="hidden">
    <div class="login-card">
      <form class="login-form" id="loginForm" autocomplete="off">
        <span class="badge-mod">Quiz</span>
        <h1>Module : Gestion du stress</h1>
        <p class="lead">Des défis pour réviser en jouant : gagne des points, des étoiles et des badges ! 🎮</p>
        <div class="row2">
          <label class="field"><span>Prénom</span><input id="inPrenom" required maxlength="40" placeholder="Ex. : Julie"></label>
          <label class="field"><span>Nom</span><input id="inNom" required maxlength="40" placeholder="Ex. : Martin"></label>
        </div>
        <label class="field"><span>🔑 Code d'accès (donné par ta formatrice ou ton formateur)</span>
          <input id="inCode" class="code-input" maxlength="6" placeholder="······" autocapitalize="characters" spellcheck="false"></label>
        <div class="err" id="loginErr"></div>
        <button class="btn" type="submit" style="width:100%">Commencer 🚀</button>
      </form>
      <div class="login-photo"><div class="float"><span class="big">🌬️</span><div><b>Garder la tête froide</b><br><small>aider la personne… et communiquer clairement</small></div></div></div>
    </div>
  </section>

  <!-- HOME -->
  <section id="home" class="hidden"></section>
  <!-- QUIZ -->
  <section id="quiz" class="hidden"></section>
  <!-- BILAN -->
  <section id="bilan" class="hidden"></section>
</main>

<script>

const KEY_X="LeoLagrange-Stress-2026";
const SALT="LLF·M3·";
const DATA=(()=>{const b=atob(BLOB),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i)^KEY_X.charCodeAt(i%KEY_X.length);return JSON.parse(new TextDecoder().decode(u));})();
const QUIZ=DATA.quizzes;
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function codeOk(code,hash){return fnv(SALT+code.trim().toUpperCase())===hash;}
function norm(s){return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z]/g,"");}
function ctrlCode(prenom,nom,pts,stars,done){const s=norm(prenom)+"|"+norm(nom)+"|"+pts+"|"+stars+"|"+done;const a=fnv("LLF*"+s),b=fnv(s+"*STRESS");return ((a.toString(36)+b.toString(36)).toUpperCase().replace(/[^A-Z0-9]/g,"")+"XXXXXX").slice(0,6);}

const STORE="llf_quiz_stress_v1";
let S=null;
function load(){try{const r=localStorage.getItem(STORE);return r?JSON.parse(r):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){}}
let sound=true;try{sound=localStorage.getItem("llf_quiz_sound")!=="0";}catch(e){}

/* ================= utilitaires ================= */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,props,...kids){const e=document.createElement(tag);if(props)for(const k in props){const v=props[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k==="style"&&typeof v==="object"){for(const sk in v){if(sk.startsWith("--"))e.style.setProperty(sk,v[sk]);else e.style[sk]=v[sk];}}else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="data")for(const d in v)e.dataset[d]=v[d];else e.setAttribute(k,v===true?"":v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleNot(a,eq){if(a.length<2)return a.slice();let s;let n=0;do{s=shuffle(a);n++;}while(n<30&&s.every((x,i)=>eq(x,i)));return s;}
function toast(t){const d=el("div",{class:"toast"},t);document.body.append(d);setTimeout(()=>d.remove(),2400);}
function starsHtml(n,max=3){let s="";for(let i=0;i<max;i++)s+=i<n?"★":'<span class="off">★</span>';return s;}
function fmt(n){return n.toLocaleString("fr-FR");}
function gamePts(g){return g.pts||100;}
function quizMax(q){return q.games.reduce((a,g)=>a+gamePts(g),0);}
const TOTAL_MAX=QUIZ.reduce((a,q)=>a+quizMax(q),0);
function show(id){for(const s of ["login","home","quiz","bilan"])$("#"+s).classList.toggle("hidden",s!==id);window.scrollTo({top:0,behavior:"smooth"});}

let AC=null;
function beep(notes){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;for(const [f,d,type] of notes){const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05);t+=d*.8;}}catch(e){}}
const SFX={good:()=>beep([[660,.12],[880,.12],[1175,.22]]),mid:()=>beep([[520,.14],[660,.2]]),bad:()=>beep([[300,.18,"triangle"],[220,.28,"triangle"]]),tick:()=>beep([[900,.05]]),win:()=>beep([[523,.12],[659,.12],[784,.12],[1047,.35]]),unlock:()=>beep([[784,.1],[1175,.25]])};
function syncSound(){$("#btnSound").textContent=sound?"🔊":"🔇";}
$("#btnSound").onclick=()=>{sound=!sound;try{localStorage.setItem("llf_quiz_sound",sound?"1":"0");}catch(e){}syncSound();if(sound)SFX.tick();};

/* ================= DRAG & DROP générique (souris + tactile + tap) ================= */
function dnd(root,place){
  let sel=null;
  const clearSel=()=>{if(sel)sel.classList.remove("selected");sel=null;};
  root.addEventListener("pointerdown",e=>{
    const chip=e.target.closest(".chip");if(!chip||!root.contains(chip)||chip.classList.contains("locked")||e.target.closest("button"))return;

    const sx=e.clientX,sy=e.clientY;const r=chip.getBoundingClientRect();const ox=sx-r.left,oy=sy-r.top;let ghost=null,over=null;
    try{chip.setPointerCapture(e.pointerId);}catch(_){}

      if(!ghost){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<7)return;clearSel();ghost=chip.cloneNode(true);ghost.classList.add("ghost");ghost.style.width=r.width+"px";document.body.append(ghost);chip.classList.add("dragging");}
      ghost.style.left=(ev.clientX-ox)+"px";ghost.style.top=(ev.clientY-oy)+"px";
      const t=document.elementFromPoint(ev.clientX,ev.clientY);let z=t&&t.closest(".dz");if(z&&!root.contains(z))z=null;
      root.querySelectorAll(".drop-before,.drop-after").forEach(x=>x.classList.remove("drop-before","drop-after"));
      if(z!==over){over&&over.classList.remove("over");over=z;z&&z.classList.add("over");}
      if(z&&z.classList.contains("olist")){const tc=t.closest(".chip");if(tc&&tc!==chip){const rr=tc.getBoundingClientRect();tc.classList.add(ev.clientY<rr.top+rr.height/2?"drop-before":"drop-after");}}
      if(ev.clientY<60)window.scrollBy(0,-12);else if(ev.clientY>innerHeight-60)window.scrollBy(0,12);
    };
    const up=ev=>{
      chip.removeEventListener("pointermove",move);chip.removeEventListener("pointerup",up);chip.removeEventListener("pointercancel",up);
      root.querySelectorAll(".drop-before,.drop-after").forEach(x=>x.classList.remove("drop-before","drop-after"));
      if(ghost){ghost.remove();chip.classList.remove("dragging");over&&over.classList.remove("over");if(over&&ev.type==="pointerup"){const t=document.elementFromPoint(ev.clientX,ev.clientY);place(chip,over,{x:ev.clientX,y:ev.clientY,target:t&&t.closest(".chip")});SFX.tick();}}

        if(sel&&sel!==chip){const z=chip.closest(".dz");if(z&&!z.contains(sel)||z&&z.classList.contains("olist")){place(sel,z,{target:chip,tap:true});clearSel();SFX.tick();return;}}
        if(sel===chip)clearSel();else{clearSel();sel=chip;chip.classList.add("selected");}
      }
    };

  });

  return {clear:clearSel};
}

function copy(txt){const done=()=>{toast("✅ Copié ! Colle-le dans le chat (Ctrl + V)");SFX.good();};

/* ================= CERTIFICAT ================= */
const CERT_MIN=0.8;

      el("div",{style:{fontSize:"14px",fontWeight:700,marginTop:"10px"}},`Bonnes réponses : ${cs.done?Math.round(cs.rate*100)+" %":"–"} (objectif ${CERT_MIN*100} %)`),el("div",{class:"cert-prog"},el("i",{style:{width:Math.min(100,cs.rate*100)+"%",background:cs.rate>=CERT_MIN?"var(--ok)":""}})),
      cs.done===QUIZ.length?el("p",{style:{margin:"10px 0 0",fontSize:"15px"}},`Tous les quiz sont terminés mais le taux n'atteint pas ${CERT_MIN*100} % : parles-en à ta formatrice / ton formateur 🙂`):null);

    el("p",{style:{margin:"6px 0 0",fontSize:"15px"}},`Félicitations ! Tu as réussi les ${QUIZ.length} quiz avec ${Math.round(cs.rate*100)} % de bonnes réponses.`),

const CW=2970,CH=2100; // A4 paysage (≈ 254 dpi)
function loadImg(src,cors){return new Promise(res=>{const i=new Image();if(cors)i.crossOrigin="anonymous";i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});}
async function loadLogo(){if(!LOGO_URL)return null;return (await loadImg(LOGO_URL,true))||(await loadImg(LOGO_URL,false));}
async function fontsReady(){if(!document.fonts)return;const f=['600 150px Caveat','150px "Great Vibes"','700 60px Poppins','400 60px Poppins','800 60px Poppins'];
  try{await Promise.race([Promise.all(f.map(v=>document.fonts.load(v,"Vanessa ÉéÀ"))),new Promise(r=>setTimeout(r,3500))]);}catch(e){}}
function dateFr(d){return d.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});}
async function drawCert(cv,I){
  await fontsReady();const logo=await loadLogo();
  const x=cv.getContext("2d");const W=CW,H=CH;const F='"Century Gothic", Poppins, sans-serif';
  const sp=v=>{if("letterSpacing" in x)x.letterSpacing=v;};
  const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();};
  const txt=(t,X,Y,font,col,align="center",ls="0px")=>{x.font=font;x.fillStyle=col;x.textAlign=align;x.textBaseline="alphabetic";sp(ls);x.fillText(t,X,Y);sp("0px");};
  const fit=(t,font,size,maxW)=>{let s=size;x.font=font.replace("{s}",s);while(x.measureText(t).width>maxW&&s>30){s-=4;x.font=font.replace("{s}",s);}return font.replace("{s}",s);};
  // fond + cercles pastel (comme les diapos)

  x.fillStyle="#E1DEF3";x.beginPath();x.arc(120,120,520,0,7);x.fill();
  x.fillStyle="#D7EEE6";x.beginPath();x.arc(W-80,H-60,560,0,7);x.fill();

  // carte blanche + double cadre
  x.save();x.shadowColor="rgba(74,67,130,.18)";x.shadowBlur=60;x.shadowOffsetY=18;rr(110,110,W-220,H-220,60);x.fillStyle="#fff";x.fill();x.restore();
  rr(150,150,W-300,H-300,44);x.lineWidth=6;x.strokeStyle="#8F87D2";x.stroke();
  rr(172,172,W-344,H-344,34);x.lineWidth=2;x.strokeStyle="#D6D1EE";x.stroke();
  // logo optionnel
  let y0=0;
  if(logo){const mh=170,mw=700;const r=Math.min(mh/logo.height,mw/logo.width);const w=logo.width*r,h=logo.height*r;x.drawImage(logo,(W-w)/2,225,w,h);y0=110;}
  // bandeau
  const lab="CERTIFICAT DE RÉUSSITE";x.font=`700 46px ${F}`;sp("12px");const lw=x.measureText(lab).width+120;sp("0px");
  rr((W-lw)/2,y0+300,lw,96,48);x.fillStyle="#8F87D2";x.fill();txt(lab,W/2+6,y0+365,`700 46px ${F}`,"#fff","center","12px");
  const T1="Module : Gestion du stress";
  txt(T1,W/2,y0+550,fit(T1,`800 {s}px ${F}`,118,W-560),"#4A4382");
  txt("Ce certificat est décerné à",W/2,y0+690,`400 56px ${F}`,"#2F2B45");
  const nm=`${I.prenom} ${I.nom}`;txt(nm,W/2,y0+855,fit(nm,`800 {s}px ${F}`,150,W-600),"#4A4382");
  x.strokeStyle="#B497D6";x.lineWidth=5;x.lineCap="round";x.beginPath();x.moveTo(W/2-560,y0+910);x.lineTo(W/2+560,y0+910);x.stroke();
  x.fillStyle="#B497D6";x.beginPath();x.arc(W/2,y0+910,12,0,7);x.fill();
  const L1=`pour avoir réussi les ${QUIZ.length} quiz du module avec ${Math.round(I.rate*100)} % de bonnes réponses.`;
  txt(L1,W/2,y0+1010,fit(L1,`400 {s}px ${F}`,54,W-560),"#2F2B45");
  const L2="Comprendre le stress  ·  Respirer pour se réguler  ·  Communiquer avec la SAED  ·  Analyser l'urgence";
  txt(L2,W/2,y0+1090,fit(L2,`400 {s}px ${F}`,44,W-560),"#6E6890");
  // pastilles
  const pills=[[`✓  ${I.done} / ${QUIZ.length} quiz`,"#DDF3EC","#2F7F68"],[`★  ${I.stars} / ${QUIZ.length*3} étoiles`,"#FFF3D6","#8A6410"],[`${fmt(I.pts)} points`,"#E9E6F7","#4A4382"],[`${I.badges} badge${I.badges>1?"s":""}`,"#FBE3E0","#A6463B"]];
  x.font=`700 44px ${F}`;const pw=pills.map(p=>x.measureText(p[0]).width+90);const tot=pw.reduce((a,b)=>a+b,0)+30*(pills.length-1);let px=(W-tot)/2;
  const py=y0+1160;
  pills.forEach((p,i)=>{rr(px,py,pw[i],88,44);x.fillStyle=p[1];x.fill();txt(p[0],px+pw[i]/2,py+60,`700 44px ${F}`,p[2]);px+=pw[i]+30;});
  // bas : date / sceau / signature
  const by=logo?1640:1590;
  txt("Fait le",560,by-40,`400 44px ${F}`,"#6E6890");
  txt(dateFr(I.date),560,by+40,`700 60px ${F}`,"#2F2B45");
  x.strokeStyle="#D6D1EE";x.lineWidth=3;x.beginPath();x.moveTo(300,by+80);x.lineTo(820,by+80);x.stroke();
  txt("Date de délivrance",560,by+135,`400 36px ${F}`,"#6E6890");
  seal(x,W/2,by-50,F);
  const sx=W-600;

  const sw=Math.min(x.measureText(SIGNATAIRE).width,900);

  x.strokeStyle="#D6D1EE";x.lineWidth=3;x.beginPath();x.moveTo(sx-400,by+80);x.lineTo(sx+400,by+80);x.stroke();

function seal(x,cx,cy,F){
  x.fillStyle="#5F57A8";
  [-1,1].forEach(d=>{x.beginPath();x.moveTo(cx+d*30,cy+60);x.lineTo(cx+d*110,cy+250);x.lineTo(cx+d*68,cy+228);x.lineTo(cx+d*40,cy+270);x.lineTo(cx-d*20,cy+90);x.closePath();x.fill();});
  x.fillStyle="#F3CD7E";x.beginPath();const n=28;for(let i=0;i<=n*2;i++){const a=i*Math.PI/n;const r=i%2?168:185;x.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}x.closePath();x.fill();
  x.fillStyle="#E9B949";x.beginPath();x.arc(cx,cy,145,0,7);x.fill();
  x.strokeStyle="#fff";x.lineWidth=5;x.setLineDash([10,10]);x.beginPath();x.arc(cx,cy,125,0,7);x.stroke();x.setLineDash([]);
  x.fillStyle="#fff";x.textAlign="center";x.textBaseline="alphabetic";x.font=`800 96px ${F}`;x.fillText("★",cx,cy+18);
  x.font=`800 34px ${F}`;if("letterSpacing" in x)x.letterSpacing="4px";x.fillText("RÉUSSI",cx+2,cy+72);if("letterSpacing" in x)x.letterSpacing="0px";
}
/* PDF minimal (1 page A4 paysage contenant l'image JPEG) : aucune librairie, fonctionne hors ligne */
function makePdf(jpeg,pw,ph){
  const bin=atob(jpeg.split(",")[1]);const img=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)img[i]=bin.charCodeAt(i);
  const enc=new TextEncoder();const parts=[];let len=0;const off=[];
  const push=v=>{const u=typeof v==="string"?enc.encode(v):v;parts.push(u);len+=u.length;};
  const obj=(n,body)=>{off[n]=len;push(`${n} 0 obj\n${body}\nendobj\n`);};
  const W=841.89,H=595.28,content=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  push("%PDF-1.4\n");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  off[4]=len;push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);push(img);push("\nendstream\nendobj\n");
  obj(5,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  obj(6,"<< /Title (Certificat de reussite - Gestion du stress) /Producer (Quiz HTML) >>");
  const xr=len;push("xref\n0 7\n0000000000 65535 f \n");for(let n=1;n<=6;n++)push(String(off[n]).padStart(10,"0")+" 00000 n \n");
  push(`trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xr}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}
function downloadCert(cv,I){
  let jpeg;try{jpeg=cv.toDataURL("image/jpeg",0.92);}catch(e){toast("Le logo empêche le téléchargement direct : choisis « Enregistrer au format PDF » dans la fenêtre d'impression.");setTimeout(()=>printCert(cv),1200);return;}
  const blob=makePdf(jpeg,cv.width,cv.height);const a=el("a",{href:URL.createObjectURL(blob),download:`Certificat de réussite - ${I.prenom} ${I.nom}.pdf`});
  document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);SFX.win();confetti();toast("📄 Certificat téléchargé !");
}
function printCert(cv){let d=$("#printCert");if(!d){d=el("div",{id:"printCert"});document.body.append(d);}d.innerHTML="";const c=el("canvas",{width:cv.width,height:cv.height});c.getContext("2d").drawImage(cv,0,0);d.append(c);setTimeout(()=>print(),100);}
